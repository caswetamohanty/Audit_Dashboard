<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--pg:#F4F5F6;--card:#fff;--tx:#1F2328;--sec:#6B7280;--bd:#D9DCE0;--ac:#3F6A8F;--acx:#fff;--sh:0 1px 2px rgba(31,35,40,.06),0 2px 8px rgba(31,35,40,.04)}
@media(prefers-color-scheme:dark){:root{--pg:#16181B;--card:#1F2328;--tx:#E6E8EB;--sec:#9AA1AB;--bd:#343A41;--ac:#7FA6C9;--acx:#10161B;--sh:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--pg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--bd)}
.top h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 auto 0 0}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;transition:all .15s}
.btn:hover:not(:disabled){border-color:var(--ac)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.menu{position:relative}#smenu{position:absolute;right:0;top:calc(100% + 4px);min-width:180px;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--sh);padding:4px;z-index:6}
#smenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}#smenu button:hover{background:var(--pg)}
main{max-width:1280px;margin:0 auto;padding:24px}
#err{margin-bottom:16px;padding:10px 14px;border:1px solid #7A2E22;border-radius:8px;background:#7A2E2218}
#drop{display:block;width:100%;border:2px dashed var(--bd);border-radius:8px;padding:72px 16px;text-align:center;background:var(--card);cursor:pointer;transition:all .15s}
#drop:hover,#drop.over{border-color:var(--ac);background:var(--pg)}#drop b{display:block;font-size:16px;margin-bottom:4px}#drop span{color:var(--sec)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;box-shadow:var(--sh)}
.kpi .k{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sec)}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums;font-weight:600}
details{margin-bottom:16px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 16px}
summary{cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sec)}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px 16px;margin-top:12px}
.dg label{display:flex;justify-content:space-between;gap:8px;align-items:center}.dg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select,input[type=text],input[type=number]{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;box-shadow:var(--sh);min-width:0}
.card header{display:flex;justify-content:space-between;gap:8px}
.card h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sub{margin:2px 0 12px;font-size:12px;color:var(--sec)}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}.card:hover .acts,.acts:focus-within{opacity:1}
@media(hover:none){.acts{opacity:1}}
.ib{border:0;background:none;padding:4px;border-radius:6px;cursor:pointer;color:var(--sec);height:28px}
.ib:hover:not(:disabled){background:var(--pg);color:var(--tx)}.ib:disabled{opacity:.35;cursor:not-allowed}
.cv{position:relative;height:300px}.empty{color:var(--sec);text-align:center;padding-top:110px}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
#dlg{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:20px;width:min(440px,92vw);max-height:90vh;overflow:auto}
#dlg h2{margin:0 0 12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.fld{display:block;margin-bottom:10px}.fld span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sec);margin-bottom:3px}
.fld select,.fld input{width:100%}.row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--pg);padding:8px 14px;border-radius:8px;z-index:20}
.lnk{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;margin-left:8px}
</style></head><body>
<div class="top">
 <h1>Excel Dashboard</h1>
 <select id="sheetsel" aria-label="Sheet" hidden></select>
 <button class="btn pri" id="up">Upload</button><button class="btn" id="add" disabled>+ Add Chart</button>
 <div class="menu"><button class="btn" id="save" aria-haspopup="menu" aria-expanded="false" disabled>Save Dashboard ▾</button>
  <div id="smenu" role="menu" hidden><button role="menuitem" id="sx">Excel (.xlsx)</button><button role="menuitem" id="sp">PowerPoint (.pptx)</button></div></div>
</div>
<input type="file" id="fx" accept=".xlsx,.xls,.csv" hidden>
<main>
 <div id="err" role="alert" hidden></div>
 <button id="drop"><b>Drop an Excel or CSV file here</b><span>or click to choose .xlsx, .xls, .csv</span></button>
 <div id="dash" hidden>
  <div class="kpis" id="kpis"></div>
  <details id="det"><summary>Detected columns</summary><div class="dg" id="detb"></div></details>
  <div class="grid" id="grid"></div>
 </div>
</main>
<div id="mask" hidden><div id="dlg" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt"></h2><div id="mb"></div></div></div>
<div id="toast" role="status" hidden></div>
<script>
/* ===== helpers & constants ===== */
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')e.className=v;else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);else if(v===true)e.setAttribute(a,'');else if(v!==false&&v!=null)e.setAttribute(a,v)}for(const c of k.flat())e.append(c);return e};
const U=m=>Object.assign(new Error(m),{user:1});
const PAL=['#4F7396','#8A94A0','#B08D57','#5F8A8B','#A07878','#7D8F69','#9A8FB0','#C4A35A','#6E7B8B','#B5651D'];
const RISK={critical:'#7A2E22',high:'#C2561E',medium:'#D9A12B',low:'#6B8F71'},RANK={critical:4,high:3,medium:2,low:1};
const RN={critical:'critical','very high':'critical',high:'high',medium:'medium',moderate:'medium',med:'medium',low:'low','very low':'low'};
const rkName=v=>RN[String(v).trim().toLowerCase()];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TL={number:'Number',date:'Date',status:'Status',process:'Process/Function',risk:'Risk Rating',text:'Text/other'};
const CLOSED=/^(closed|resolved|done|complete|completed|remediated|cancelled)$/i;
const STAT=/^(open|closed|in progress|overdue|resolved|pending|done|complete|completed|new|not started|on hold|cancelled)$/i;
const PEN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
const XI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
const S={mode:'empty',file:'',wb:null,headers:[],rows:[],types:[],card:[],dmy:[],charts:[],kp:[],nrows:0,ncols:0};
const CH={};
const blank=v=>v==null||(typeof v==='string'&&v.trim()==='');
const fmt=v=>typeof v==='number'?v.toLocaleString(undefined,{maximumFractionDigits:2}):String(v);

/* ===== detection ===== */
const toNum=v=>{if(typeof v==='number')return isFinite(v)?v:NaN;if(typeof v!=='string')return NaN;const s=v.replace(/[,%\s$€£₹¥]/g,'');return /^-?(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):NaN};
const mIdx=s=>{const i='janfebmaraprmayjunjulaugsepoctnovdec'.indexOf(s.slice(0,3).toLowerCase());return i>=0&&i%3===0?i/3:-1};
function toDate(v,dmy){
 if(v instanceof Date)return isNaN(v)?null:v;
 if(typeof v==='number'){if(v<20000||v>80000)return null;const u=new Date(Math.round((v-25569)*864e5));return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate())}
 if(typeof v!=='string')return null;
 const s=v.trim();let m;
 if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return new Date(+m[1],m[2]-1,+m[3]);
 if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){let d=dmy?+m[1]:+m[2],mo=dmy?+m[2]:+m[1],y=+m[3];if(y<100)y+=2000;return mo>=1&&mo<=12&&d>=1&&d<=31?new Date(y,mo-1,d):null}
 if(m=s.match(/^([A-Za-z]{3,9})[ ,\-]+(\d{4})$/)){const i=mIdx(m[1]);return i<0?null:new Date(+m[2],i,1)}
 if(m=s.match(/^(\d{1,2})[ \-\/]([A-Za-z]{3,9})[ \-\/,]+(\d{2,4})$/)){const i=mIdx(m[2]);let y=+m[3];if(y<100)y+=2000;return i<0?null:new Date(y,i,+m[1])}
 return null}
function detect(){
 const n=S.headers.length;S.types=[];S.card=[];S.dmy=[];
 for(let c=0;c<n;c++){
  const vals=[],set=new Set();
  for(let r=0;r<S.rows.length&&(vals.length<200||set.size<1000);r++){const v=S.rows[r][c];if(blank(v))continue;if(vals.length<200)vals.push(v);if(set.size<1000)set.add(v instanceof Date?+v:String(v).trim().toLowerCase())}
  let dmy=true,sawM=false;
  for(const v of vals){const m=typeof v==='string'&&v.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.]\d{2,4}$/);if(m){if(+m[1]>12){dmy=true;break}if(+m[2]>12){dmy=false;break}}}
  S.dmy[c]=dmy;S.card[c]=set.size;
  const hd=S.headers[c].toLowerCase(),N=vals.length||1,u=set.size;
  const nums=vals.filter(v=>!isNaN(toNum(v))).length/N;
  const dts=vals.filter(v=>(v instanceof Date||typeof v==='string')&&toDate(v,dmy)).length/N;
  const serial=nums>=.9&&/date|time|created|due|opened|raised|closed on/.test(hd)&&vals.every(v=>toNum(v)>20000&&toNum(v)<80000);
  const riskSh=vals.filter(v=>typeof v==='string'&&rkName(v)).length/N,stSh=vals.filter(v=>typeof v==='string'&&STAT.test(v.trim())).length/N;
  let t='text';
  if(vals.length&&(dts>=.9||serial))t='date';
  else if(vals.length&&nums>=.9)t='number';
  else if((/risk|rating|severity|priority/.test(hd)&&u<=15)||(riskSh>=.6&&u<=10))t='risk';
  else if((/status/.test(hd)&&u<=10)||(u<=10&&stSh>=.6))t='status';
  else if(/process|function|department|business unit|area|domain/.test(hd)&&u>1)t='process';
  S.types[c]=t}}

/* ===== aggregation ===== */
function compute(sp){
 const H=S.headers,T=S.types,d=sp.dimIdx;let met=sp.metric,m=sp.metricIdx;
 if(met!=='count'&&m==null)met=sp.metric='count';
 const note=sp.note?' · '+sp.note:'';
 const md=met==='count'?'Count of rows':(met==='sum'?'Sum':'Average')+' of '+H[m];
 if(d==null){Object.assign(sp,{labels:[],values:[],empty:true,dimName:'',subtitle:'No suitable column detected — use the pencil to choose one'+note});sp.title=sp.title||'Chart';return}
 sp.empty=false;
 if(d===-1){ // number column by row order, bucketed to <=50 points
  const xs=[];for(const r of S.rows){const x=toNum(r[m]);if(!isNaN(x))xs.push(x)}
  const b=Math.max(1,Math.ceil(xs.length/50));sp.labels=[];sp.values=[];
  for(let i=0;i<xs.length;i+=b){const sl=xs.slice(i,i+b);sp.labels.push('#'+(i+1));sp.values.push(sl.reduce((a,c)=>a+c,0)/sl.length)}
  sp.dimName='(row order)';sp.title=sp.title||H[m]+' by row order';
  sp.subtitle='Average of '+H[m]+' by row order'+(b>1?' ('+b+' rows per point)':'')+note;return}
 const isDate=T[d]==='date',map=new Map();
 for(const row of S.rows){ // single pass
  const v=row[d];let key;
  if(isDate){const dt=toDate(v,S.dmy[d]);key=dt?dt.getFullYear()*12+dt.getMonth():-1}else key=blank(v)?'':String(v).trim();
  let o=map.get(key);if(!o){o={c:0,s:0,n:0};map.set(key,o)}
  o.c++;if(met!=='count'){const x=toNum(row[m]);if(!isNaN(x)){o.s+=x;o.n++}}}
 const val=o=>met==='count'?o.c:met==='sum'?o.s:(o.n?o.s/o.n:0);
 let grouped=false;const N=sp.topN||10;
 if(isDate){
  const ents=[...map.entries()].filter(e=>e[0]!==-1).sort((a,b)=>a[0]-b[0]);
  sp.labels=ents.map(e=>MON[e[0]%12]+' '+Math.floor(e[0]/12));sp.values=ents.map(e=>val(e[1]));
  if(map.has(-1)){sp.labels.push('(blank)');sp.values.push(val(map.get(-1)))}
 }else{
  let ents=[...map.entries()].map(([k,o])=>({l:k===''?'(blank)':k,o}));
  if(ents.length&&ents.every(e=>rkName(e.l)||e.l==='(blank)'))ents.sort((a,b)=>(RANK[rkName(b.l)]||0)-(RANK[rkName(a.l)]||0));
  else{ents.sort((a,b)=>val(b.o)-val(a.o));
   if(ents.length>N){const rest=ents.slice(N).reduce((a,e)=>({c:a.c+e.o.c,s:a.s+e.o.s,n:a.n+e.o.n}),{c:0,s:0,n:0});ents=ents.slice(0,N);ents.push({l:'Other',o:rest});grouped=true}}
  sp.labels=ents.map(e=>e.l);sp.values=ents.map(e=>val(e.o))}
 sp.dimName=H[d];sp.title=sp.title||md+' by '+H[d];
 sp.subtitle=md+' by '+H[d]+(isDate?' (month)':'')+(grouped?' · top '+N+', rest as “Other”':'')+note}
function autoCharts(){
 const T=S.types,H=S.headers,idx=t=>T.map((x,i)=>x===t?i:-1).filter(i=>i>=0);
 const proc=idx('process'),risk=idx('risk'),stat=idx('status'),date=idx('date'),num=idx('number');
 const low=ex=>{const i=T.findIndex((t,i)=>(t==='text'||t==='process')&&S.card[i]>1&&S.card[i]<=12&&!ex.includes(i));return i<0?null:i};
 const mk=(slot,type,d,note,x={})=>({id:'a-'+slot,slot,auto:true,type,dimIdx:d,metric:'count',metricIdx:null,topN:10,note:note||'',title:'',...x});
 let bd=proc[0],bn='';
 if(bd==null){bd=T.findIndex((t,i)=>t==='text'&&S.card[i]>1&&S.card[i]<=500);if(bd<0)bd=risk[0]??stat[0]??null;if(bd!=null)bn='No Process/Function column — using “'+H[bd]+'”'}
 let line;
 if(date.length)line=mk('line','line',date[0]);
 else if(num.length)line=mk('line','line',-1,'No date column — showing “'+H[num[0]]+'” by row order',{metric:'avg',metricIdx:num[0]});
 else line=mk('line','line',null,'No date or number column');
 let pd=risk[0],pn='';
 if(pd==null){pd=stat[0]??low([]);if(pd!=null)pn='No Risk Rating column — using “'+H[pd]+'”'}
 let dd=stat.find(i=>i!==pd),dn='';
 if(dd==null){dd=low(pd==null?[]:[pd]);if(dd!=null)dn='No Status column — using “'+H[dd]+'”'}
 return[mk('bar','bar',bd,bn),line,mk('pie','pie',pd??null,pn),mk('doughnut','doughnut',dd??null,dn)]}
function kpis(){
 const T=S.types,k=[{label:'Total rows',value:S.rows.length},{label:'Columns',value:S.headers.length}];
 const st=T.indexOf('status');
 if(st>=0){let o=0,t=0;for(const r of S.rows){const v=r[st];if(blank(v))continue;t++;if(!CLOSED.test(String(v).trim()))o++}k.push({label:'% Open',value:t?Math.round(o/t*1000)/10+'%':'n/a'})}
 const rk=T.indexOf('risk');
 if(rk>=0){let n=0;for(const r of S.rows){const x=rkName(r[rk]??'');if(x==='high'||x==='critical')n++}k.push({label:'High / Critical',value:n})}
 return k}

/* ===== chart factory ===== */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const centre={id:'ctr',afterDraw(ch){
 if(ch.config.type!=='doughnut'||ch.$noTotal)return;
 const{ctx,chartArea:a}=ch,x=(a.left+a.right)/2,y=(a.top+a.bottom)/2,tot=ch.data.datasets[0].data.reduce((p,c)=>p+c,0);
 ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=css('--tx');ctx.font='600 24px system-ui,sans-serif';ctx.fillText(fmt(Math.round(tot*100)/100),x,y-6);
 ctx.fillStyle=css('--sec');ctx.font='11px system-ui,sans-serif';ctx.fillText('TOTAL',x,y+16);ctx.restore()}};
function draw(sp,cv){
 const t=sp.type,single=t==='bar'||t==='line',txt=css('--sec'),grid=css('--bd');
 Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
 const risk=sp.labels.length&&sp.labels.every(l=>rkName(l)||l==='(blank)'||l==='Other');
 const cols=sp.labels.map((l,i)=>risk&&rkName(l)?RISK[rkName(l)]:(l==='Other'||l==='(blank)'?'#B4B9BF':PAL[i%PAL.length]));
 const ds={data:sp.values,backgroundColor:t==='bar'?(risk?cols:PAL[0]):t==='line'?PAL[0]+'30':cols,borderColor:t==='line'?PAL[0]:css('--card'),borderWidth:t==='line'?2:single?0:2};
 if(t==='bar'){ds.borderRadius=4;ds.maxBarThickness=48}
 if(t==='line'){ds.fill=true;ds.tension=.3;ds.pointRadius=2}
 const ch=new Chart(cv,{type:t,data:{labels:sp.labels,datasets:[ds]},plugins:[centre],options:{responsive:true,maintainAspectRatio:false,animation:{duration:200},cutout:'62%',
  plugins:{legend:{display:!single,position:'bottom',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,color:txt}}},
  scales:single?{x:{grid:{display:false},border:{display:false},ticks:{color:txt,maxRotation:40,callback(v){const l=String(this.getLabelForValue(v));return l.length>16?l.slice(0,15)+'…':l}}},y:{beginAtZero:true,grid:{color:grid},border:{display:false},ticks:{color:txt}}}:{}}});
 ch.$noTotal=sp.metric==='avg';CH[sp.id]=ch}

/* ===== UI: render ===== */
function iconBtn(svg,label,fn,dis){const b=h('button',{class:'ib','aria-label':label,title:dis?'Needs the source Excel':label,disabled:dis,onclick:fn});b.innerHTML=svg;return b} // svg is a static constant
function card(sp){
 const L=false;
 return h('article',{class:'card'},
  h('header',{},h('div',{},h('h3',{},sp.title),h('p',{class:'sub'},sp.subtitle||'')),
   h('div',{class:'acts'},iconBtn(PEN,'Edit chart '+sp.title,()=>openModal(sp),L),iconBtn(XI,'Remove chart '+sp.title,()=>removeChart(sp)))),
  h('div',{class:'cv'},sp.empty?h('p',{class:'empty'},'No suitable column found for this chart.'):h('canvas',{id:'cv-'+sp.id,role:'img','aria-label':sp.title})))}
function renderAll(){
 for(const k in CH){CH[k].destroy();delete CH[k]}
 const g=$('#grid');g.replaceChildren(...S.charts.map(card));
 $('#kpis').replaceChildren(...S.kp.map(k=>h('div',{class:'kpi'},h('span',{class:'k'},k.label),h('b',{},fmt(k.value)))));
 applyMode();
 S.charts.forEach(sp=>{if(!sp.empty)draw(sp,document.getElementById('cv-'+sp.id))})}
function applyMode(){
 const m=S.mode,E=m==='empty';
 $('#drop').hidden=!E;$('#dash').hidden=E;$('#det').hidden=m!=='full';
 const a=$('#add');a.disabled=m!=='full';
 $('#save').disabled=E;$('#sheetsel').hidden=!(m==='full'&&S.wb&&S.wb.SheetNames.length>1)}
function renderDet(){
 $('#detb').replaceChildren(...S.headers.map((n,i)=>{
  const s=h('select',{'aria-label':'Type of '+n},Object.entries(TL).map(([v,l])=>h('option',{value:v},l)));s.value=S.types[i];
  s.addEventListener('change',()=>{S.types[i]=s.value;recompute()});
  return h('label',{},h('span',{title:n},n),s)}))}
function recompute(){ // after column override
 const na=autoCharts();
 S.charts=S.charts.map(c=>{if(c.auto){const n=na.find(x=>x.slot===c.slot);compute(n);return n}compute(c);return c});
 S.kp=kpis();renderAll()}
function removeChart(sp){
 const i=S.charts.indexOf(sp);S.charts.splice(i,1);renderAll();
 toast('Chart removed','Undo',()=>{S.charts.splice(i,0,sp);renderAll()})}
let tt;function toast(m,lbl,fn){const t=$('#toast');t.replaceChildren(m);if(lbl)t.append(h('button',{class:'lnk',onclick:()=>{fn();t.hidden=true}},lbl));t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,5000)}
const showErr=m=>{const e=$('#err');e.textContent=m;e.hidden=false},clearErr=()=>$('#err').hidden=true;

/* ===== UI: modal (add / edit) ===== */
let lastFocus=null;
const sel=(o,v)=>{const s=h('select',{},o.map(([a,b])=>h('option',{value:a},b)));s.value=v;return s};
const fld=(l,c)=>h('label',{class:'fld'},h('span',{},l),c);
function openModal(sp){
 if(S.mode!=='full')return;
 lastFocus=document.activeElement;
 const H=S.headers,T=S.types,rk=i=>T[i]==='process'?0:(T[i]==='text'&&/issue|description/i.test(H[i]))?1:2;
 const order=[...H.keys()].sort((a,b)=>rk(a)-rk(b)||a-b);
 const dopts=order.map(i=>[i,H[i]+(rk(i)<2?'  ('+(T[i]==='process'?'Process/Function':'Issue Description')+')':'')]);
 if(sp&&sp.dimIdx===-1)dopts.unshift([-1,'(row order)']);
 const nums=H.map((n,i)=>T[i]==='number'?[i,n]:null).filter(Boolean);
 const F={title:h('input',{type:'text',value:sp?sp.title:'',placeholder:'Auto title'}),
  type:sel([['bar','Bar'],['line','Line'],['pie','Pie'],['doughnut','Doughnut']],sp?sp.type:'bar'),
  dim:sel(dopts,sp&&sp.dimIdx!=null?sp.dimIdx:order[0]),
  met:sel(nums.length?[['count','Count of rows'],['sum','Sum'],['avg','Average']]:[['count','Count of rows']],sp?sp.metric:'count'),
  mcol:sel(nums.length?nums:[['','—']],sp&&sp.metricIdx!=null?sp.metricIdx:(nums[0]||[''])[0]),
  n:h('input',{type:'number',min:2,max:50,value:sp?sp.topN:10})};
 const mrow=fld('Metric column',F.mcol),sync=()=>mrow.hidden=F.met.value==='count';
 F.met.addEventListener('change',sync);sync();
 const ok=()=>{
  const o=sp||{id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},met=F.met.value;
  Object.assign(o,{title:F.title.value.trim(),type:F.type.value,dimIdx:+F.dim.value,metric:met,metricIdx:met==='count'?null:+F.mcol.value,topN:Math.max(2,Math.min(50,+F.n.value||10)),auto:false,note:''});
  compute(o);if(!sp)S.charts.push(o);closeModal(true);renderAll()};
 $('#mt').textContent=sp?'Edit chart':'Add chart';
 $('#mb').replaceChildren(fld('Title (optional)',F.title),fld('Chart type',F.type),fld('Dimension',F.dim),fld('Metric',F.met),mrow,fld('Top N (rest grouped as Other)',F.n),
  h('div',{class:'row'},h('button',{class:'btn',onclick:()=>closeModal()},'Cancel'),h('button',{class:'btn pri',onclick:ok},sp?'Apply':'Add chart')));
 $('#mask').hidden=false;F.title.focus()}
function closeModal(skip){$('#mask').hidden=true;if(!skip&&lastFocus)lastFocus.focus()}
$('#mask').addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();return}
 if(e.key!=='Tab')return;
 const f=[...$('#dlg').querySelectorAll('input,select,button')].filter(x=>!x.closest('[hidden]')&&!x.disabled);
 if(!f.length)return;const a=f[0],z=f[f.length-1];
 if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}});
$('#mask').addEventListener('mousedown',e=>{if(e.target.id==='mask')closeModal()});

/* ===== upload / parse ===== */
function useSheet(name){
 const aoa=XLSX.utils.sheet_to_json(S.wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
 const hi=aoa.findIndex(r=>r.some(v=>!blank(v)));
 if(hi<0)throw U('This sheet is empty. Choose another sheet or file.');
 const body=aoa.slice(hi+1).filter(r=>r.some(v=>!blank(v)));
 if(!body.length)throw U('This sheet has headers but no data rows.');
 const w=Math.max(aoa[hi].length,...body.map(r=>r.length)),seen={};
 const hd=Array.from({length:w},(_,i)=>{let n=blank(aoa[hi][i])?'Column '+(i+1):String(aoa[hi][i]).trim();const b=n;seen[b]=(seen[b]||0)+1;return seen[b]>1?b+' ('+seen[b]+')':n});
 S.headers=hd;S.rows=body;S.mode='full';S.nrows=body.length;S.ncols=w;
 detect();S.charts=autoCharts();S.charts.forEach(compute);S.kp=kpis();renderDet();renderAll()}
async function handleFile(f){
 clearErr();
 try{
  if(!/\.(xlsx|xls|csv)$/i.test(f.name))throw U('Unsupported file type. Choose an .xlsx, .xls or .csv file.');
  if(!window.XLSX||!window.Chart)throw U('Libraries did not load. Check your internet connection and reload the page.');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  if(!wb.SheetNames.length)throw U('The workbook has no sheets.');
  S.wb=wb;S.file=f.name;
  $('#sheetsel').replaceChildren(...wb.SheetNames.map(n=>h('option',{value:n},n)));
  useSheet(wb.SheetNames[0])
 }catch(e){showErr(e.user?e.message:'Could not read this file. Make sure it is a valid Excel or CSV file.')}}
$('#sheetsel').addEventListener('change',e=>{clearErr();try{useSheet(e.target.value)}catch(x){showErr(x.user?x.message:'Could not read this sheet.')}});

/* ===== export (Excel / PowerPoint, summary numbers only) ===== */
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`};
const cut=(a,l)=>l?a.slice(-50):a.slice(0,50),r2=x=>Math.round(x*100)/100;
const exportable=()=>S.charts.filter(c=>!c.empty).map(c=>({...c,labels:cut(c.labels,c.type==='line').map(String),values:cut(c.values,c.type==='line').map(r2)}));
function saveXlsx(){
 if(!window.XLSX)return showErr('Excel library did not load. Check your connection and reload.');
 const wb=XLSX.utils.book_new(),cs=exportable();
 const sum=[['Dashboard summary'],['Source file',S.file],['Rows',S.nrows],['Columns',S.ncols],[],['KPI','Value'],...S.kp.map(k=>[k.label,k.value])];
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'Summary');
 const used=new Set(['Summary']);
 cs.forEach((c,i)=>{
  let n=(i+1+' '+c.title).replace(/[\[\]:*?\/\\]/g,'').slice(0,31);while(used.has(n))n=n.slice(0,28)+'~'+i;used.add(n);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[c.title],[c.subtitle||''],[],[c.dimName||'Category',c.metric==='count'?'Count':c.metric==='sum'?'Sum':'Average'],...c.labels.map((l,j)=>[l,c.values[j]])]),n)});
 XLSX.writeFile(wb,'dashboard-'+stamp()+'.xlsx')}
const PPTX_URLS=['https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js','https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js','https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js'];
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>{e.remove();no()};document.head.append(e)});
async function ensurePptx(){ // loads PptxGenJS on demand, trying several CDNs
 if(window.PptxGenJS)return true;
 for(const u of PPTX_URLS){try{await loadScript(u);if(window.PptxGenJS)return true}catch{}}
 return false}
async function savePptx(){
 if(!await ensurePptx())return showErr('PowerPoint library could not be loaded from any CDN. Check your internet connection or firewall (cdn.jsdelivr.net, cdnjs.cloudflare.com, unpkg.com) and try again.');
 const px=new PptxGenJS();px.layout='LAYOUT_16x9';
 const tx='1F2328',sc='6B7280',hx=c=>c.replace('#','');
 let s=px.addSlide();
 s.addText('Dashboard',{x:.6,y:1.8,w:8.8,h:1,fontSize:36,bold:true,color:tx});
 s.addText((S.file||'Data summary')+' · '+fmt(S.nrows)+' rows, '+S.ncols+' columns',{x:.6,y:2.8,w:8.8,h:.5,fontSize:16,color:sc});
 s=px.addSlide();s.addText('Key figures',{x:.5,y:.3,w:9,h:.6,fontSize:22,bold:true,color:tx});
 S.kp.forEach((k,i)=>{const x=.5+(i%2)*4.6,y=1.2+Math.floor(i/2)*1.5;
  s.addShape(px.ShapeType.rect,{x,y,w:4.3,h:1.3,fill:{color:'F4F5F6'},line:{color:'D9DCE0',width:1}});
  s.addText(k.label.toUpperCase(),{x:x+.2,y:y+.1,w:3.9,h:.35,fontSize:11,color:sc});
  s.addText(fmt(k.value),{x:x+.2,y:y+.5,w:3.9,h:.7,fontSize:28,bold:true,color:tx})});
 const T={bar:px.charts.BAR,line:px.charts.LINE,pie:px.charts.PIE,doughnut:px.charts.DOUGHNUT};
 for(const c of exportable()){
  const sl=px.addSlide(),pc=c.type==='pie'||c.type==='doughnut';
  const risk=c.labels.length&&c.labels.every(l=>rkName(l)||l==='(blank)'||l==='Other');
  const cols=c.labels.map((l,i)=>hx(risk&&rkName(l)?RISK[rkName(l)]:(l==='Other'||l==='(blank)'?'#B4B9BF':PAL[i%PAL.length])));
  sl.addText(c.title,{x:.5,y:.25,w:9,h:.5,fontSize:20,bold:true,color:tx});
  sl.addText(c.subtitle||'',{x:.5,y:.75,w:9,h:.4,fontSize:11,color:sc});
  const o={x:.5,y:1.25,w:9,h:4.1,showLegend:pc,legendPos:'b',legendFontSize:11,catAxisLabelFontSize:10,valAxisLabelFontSize:10,
   chartColors:pc||(c.type==='bar'&&risk)?cols:['4F7396']};
  if(c.type==='bar')o.barDir='col';
  if(c.type==='line'){o.lineSize=2;o.lineDataSymbolSize=5}
  if(pc){o.showPercent=true;o.showValue=false;o.dataLabelColor='FFFFFF';o.dataLabelFontSize=10;if(c.type==='doughnut')o.holeSize=60}
  sl.addChart(T[c.type],[{name:c.dimName||'Value',labels:c.labels,values:c.values}],o)}
 px.writeFile({fileName:'dashboard-'+stamp()+'.pptx'})}

/* ===== wiring ===== */
const fx=$("#fx");
$('#up').onclick=$('#drop').onclick=()=>fx.click();
fx.onchange=()=>{if(fx.files[0])handleFile(fx.files[0]);fx.value=''};
$('#add').onclick=()=>openModal(null);
const sm=$('#smenu'),sb=$('#save'),tog=o=>{sm.hidden=!o;sb.setAttribute('aria-expanded',o)};
sb.onclick=e=>{e.stopPropagation();tog(sm.hidden)};
$('#sx').onclick=()=>{tog(false);clearErr();saveXlsx()};$('#sp').onclick=()=>{tog(false);clearErr();savePptx()};
addEventListener('click',()=>tog(false));
addEventListener('keydown',e=>{if(e.key==='Escape'&&!sm.hidden){tog(false);sb.focus()}});
addEventListener('dragover',e=>{e.preventDefault();$('#drop').classList.add('over')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#drop').classList.remove('over')});
addEventListener('drop',e=>{e.preventDefault();$('#drop').classList.remove('over');const f=e.dataTransfer.files[0];if(f)handleFile(f)});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(S.mode!=='empty')renderAll()});
applyMode();ensurePptx(); // preload in background
</script></body></html>
